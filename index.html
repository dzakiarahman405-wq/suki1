<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Digital Saya</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1f2937;
            --text-light: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .app-container { width: 100%; max-width: 480px; padding-bottom: 40px; }
        .header { text-align: center; color: white; margin-bottom: 25px; margin-top: 10px; }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        .header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }

        .balance-card { background: var(--card-bg); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 20px; }
        .balance-card h4 { color: var(--text-light); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .balance-card .total-balance { font-size: 36px; font-weight: 700; color: var(--primary-dark); margin: 10px 0; letter-spacing: -1px; }

        .summary-row { display: flex; gap: 15px; margin-bottom: 25px; }
        .summary-card { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .summary-card h4 { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
        .summary-card p { font-size: 16px; font-weight: 700; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        .form-card { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .form-card h3 { font-size: 16px; margin-bottom: 15px; color: var(--text-dark); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 8px; font-weight: 600; }
        .input-group input {
            width: 100%; padding: 14px 15px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s; background: #f9fafb;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: white; }
        
        /* DESAIN BARU UNTUK TOMBOL TIPE (TOGGLE) */
        .type-toggle {
            display: flex;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 4px;
            border: 2px solid #e5e7eb;
        }
        .type-toggle input[type="radio"] { display: none; }
        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #type-income:checked + .toggle-btn {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        #type-expense:checked + .toggle-btn {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }

        .btn-add {
            width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.2s, background 0.3s; margin-top: 5px;
        }
        .btn-add:active { transform: scale(0.98); }
        .btn-add:hover { background: var(--primary-dark); }

        .history-section h3 { color: white; font-size: 16px; margin-bottom: 15px; padding-left: 5px; }
        .transaction-list { list-style: none; }
        .transaction-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid transparent; animation: slideIn 0.3s ease-out;
        }
        .transaction-item.income { border-left-color: var(--success); }
        .transaction-item.expense { border-left-color: var(--danger); }

        .item-info { display: flex; flex-direction: column; }
        .item-title { font-weight: 600; font-size: 14px; color: var(--text-dark); }
        .item-amount { font-weight: 700; font-size: 15px; margin-top: 3px; }
        .item-amount.income { color: var(--success); }
        .item-amount.expense { color: var(--danger); }

        .btn-delete { background: #fee2e2; color: var(--danger); border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-delete:hover { background: #fecaca; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .empty-state { text-align: center; color: rgba(255,255,255,0.8); padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Dompet Digital</h1>
            <p>Kelola keuanganmu dengan mudah</p>
        </div>

        <div class="balance-card">
            <h4>Total Saldo</h4>
            <div class="total-balance" id="balance">Rp 0</div>
        </div>

        <div class="summary-row">
            <div class="summary-card">
                <h4>Pemasukan</h4>
                <p id="money-plus" class="text-success">Rp 0</p>
            </div>
            <div class="summary-card">
                <h4>Pengeluaran</h4>
                <p id="money-minus" class="text-danger">Rp 0</p>
            </div>
        </div>

        <div class="form-card">
            <h3>Tambah Transaksi</h3>
            <div class="input-group">
                <label>Keterangan</label>
                <input type="text" id="text" placeholder="Cth: Gaji Bulanan, Beli Makan">
            </div>
            <div class="input-group">
                <label>Jumlah (Rp)</label>
                <input type="text" id="amount" placeholder="0" inputmode="numeric">
            </div>
            
            <!-- DESAIN BARU: TOMBOL TOGGLE -->
            <div class="input-group">
                <label>Tipe Transaksi</label>
                <div class="type-toggle">
                    <input type="radio" name="type" id="type-income" value="income" checked>
                    <label for="type-income" class="toggle-btn">Pemasukan (+)</label>
                    
                    <input type="radio" name="type" id="type-expense" value="expense">
                    <label for="type-expense" class="toggle-btn">Pengeluaran (-)</label>
                </div>
            </div>

            <button class="btn-add" onclick="addTransaction()">Simpan Transaksi</button>
        </div>

        <div class="history-section">
            <h3>Riwayat Transaksi</h3>
            <ul id="list" class="transaction-list"></ul>
            <div id="empty-state" class="empty-state">Belum ada transaksi. Yuk catat yang pertama!</div>
        </div>
    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const money_plus = document.getElementById('money-plus');
        const money_minus = document.getElementById('money-minus');
        const list = document.getElementById('list');
        const emptyState = document.getElementById('empty-state');
        const amountInput = document.getElementById('amount');

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0
            }).format(angka);
        }

        amountInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value !== '') {
                value = new Intl.NumberFormat('id-ID').format(value);
            }
            e.target.value = value;
        });

        function addTransaction() {
            const text = document.getElementById('text').value.trim();
            const rawAmount = amountInput.value.replace(/\./g, '');
            const amount = parseFloat(rawAmount);
            
            // Mengambil nilai dari tombol radio yang dipilih
            const type = document.querySelector('input[name="type"]:checked').value;

            if (text === '' || isNaN(amount) || amount <= 0) {
                alert('Mohon isi keterangan dan jumlah uang dengan benar!');
                return;
            }

            const finalAmount = type === 'expense' ? -amount : amount;

            const transaction = {
                id: Date.now(),
                text: text,
                amount: finalAmount
            };

            transactions.push(transaction);
            updateLocalStorage();
            init();

            // Reset form
            document.getElementById('text').value = '';
            amountInput.value = '';
            document.getElementById('type-income').checked = true; // Reset ke Pemasukan
        }

        function removeTransaction(id) {
            if(confirm('Hapus transaksi ini?')) {
                transactions = transactions.filter(t => t.id !== id);
                updateLocalStorage();
                init();
            }
        }

        function updateValues() {
            const amounts = transactions.map(t => t.amount);
            const total = amounts.reduce((acc, item) => acc + item, 0);
            const income = amounts.filter(item => item > 0).reduce((acc, item) => acc + item, 0);
            const expense = (amounts.filter(item => item < 0).reduce((acc, item) => acc + item, 0) * -1);

            balanceEl.innerText = formatRupiah(total);
            money_plus.innerText = formatRupiah(income);
            money_minus.innerText = formatRupiah(expense);
        }

        function init() {
            list.innerHTML = '';
            if (transactions.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                [...transactions].reverse().forEach(t => {
                    const li = document.createElement('li');
                    li.className = `transaction-item ${t.amount < 0 ? 'expense' : 'income'}`;
                    const sign = t.amount < 0 ? '-' : '+';
                    li.innerHTML = `
                        <div class="item-info">
                            <span class="item-title">${t.text}</span>
                            <span class="item-amount ${t.amount < 0 ? 'expense' : 'income'}">${sign} ${formatRupiah(Math.abs(t.amount))}</span>
                        </div>
                        <button class="btn-delete" onclick="removeTransaction(${t.id})">✕</button>
                    `;
                    list.appendChild(li);
                });
            }
            updateValues();
        }

        function updateLocalStorage() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        init();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        }
    </script>
</body>
</html>
